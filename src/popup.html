<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root { --pink:#fb7299; --bg:#18181b; --card:rgba(255,255,255,.06);
          --border:rgba(255,255,255,.12); --text:#e4e4e7; --sub:#a1a1aa; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:340px; background:var(--bg); color:var(--text);
         font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif; padding:14px; }
  h1 { font-size:15px; color:var(--pink); margin-bottom:10px; }
  .hint { color:var(--sub); font-size:12px; line-height:1.6; margin-bottom:10px; }
  .row { display:flex; gap:6px; margin-bottom:8px; }
  input { flex:1; min-width:0; padding:8px 10px; background:var(--card); border:1px solid var(--border);
          border-radius:8px; color:#fff; font-size:13px; outline:none; }
  input:focus { border-color:var(--pink); }
  #p { width:52px; text-align:center; flex:none; }
  button { padding:8px 12px; border:none; border-radius:8px; background:var(--pink);
           color:#fff; font-size:13px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button:disabled { opacity:.5; cursor:wait; }
  button.ghost { background:var(--card); border:1px solid var(--border); }
  .err { display:none; color:#ff6b6b; font-size:12px; padding:6px 10px;
         border-left:3px solid #e53e3e; background:rgba(248,215,218,.08);
         border-radius:6px; margin-bottom:8px; word-break:break-all; }
  .card { display:none; }
  .head { display:flex; gap:10px; margin-bottom:10px; }
  .cover { width:96px; height:60px; object-fit:cover; border-radius:6px; background:#27272a; flex:none; }
  .t { font-size:13px; font-weight:600; line-height:1.4; margin-bottom:4px;
       display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .m { color:var(--sub); font-size:11px; }
  .sec { margin-bottom:8px; }
  .label { font-size:11px; color:var(--sub); margin-bottom:3px; }
  .linkbox { display:flex; gap:6px; align-items:stretch; }
  .link { flex:1; min-width:0; padding:7px 9px; background:var(--card); border:1px solid var(--border);
          border-radius:8px; font-size:11px; word-break:break-all; max-height:52px; overflow:auto; }
  .tip { font-size:10px; color:var(--sub); margin-top:2px; }
  .srv { display:flex; gap:6px; margin-top:10px; align-items:center; }
  .srv input { font-size:12px; }
  .toast { position:fixed; left:50%; top:10px; transform:translateX(-50%);
           background:rgba(0,0,0,.9); border:1px solid var(--border); color:#fff;
           padding:6px 14px; border-radius:6px; font-size:12px; opacity:0; transition:.25s;
           pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
  <h1>B站视频直链助手</h1>

  <div class="row">
    <input id="bv" placeholder="BV号或B站链接" spellcheck="false">
    <input id="p" type="number" value="1" min="1" title="分P">
    <button id="go">解析</button>
  </div>
  <div class="row" style="align-items:center; margin-bottom:8px;">
    <span style="font-size:11px; color:var(--sub); flex:none;">解析引擎</span>
    <label style="font-size:12px; display:flex; align-items:center; gap:3px; cursor:pointer;">
      <input type="radio" name="eng" value="direct" style="width:auto; flex:none; accent-color:var(--pink);"> 插件直连
    </label>
    <label style="font-size:12px; display:flex; align-items:center; gap:3px; cursor:pointer;">
      <input type="radio" name="eng" value="server" style="width:auto; flex:none; accent-color:var(--pink);"> 自建服务
    </label>
  </div>

  <div class="err" id="err"></div>

  <div class="card" id="card">
    <div class="head">
      <img class="cover" id="pic" alt="">
      <div>
        <div class="t" id="title"></div>
        <div class="m" id="meta"></div>
      </div>
    </div>

    <div class="sec">
      <div class="label">CDN 直链（1小时内有效，可直接给播放器）</div>
      <div class="linkbox">
        <div class="link" id="direct"></div>
        <button class="ghost" id="copyDirect">复制</button>
      </div>
      <div class="tip">已自动复制到剪贴板，直接去 VRChat 粘贴即可</div>
    </div>

    <div class="sec">
      <div class="label">自建服务链接（稳定不过期）</div>
      <div class="linkbox">
        <div class="link" id="srvlink"></div>
        <button class="ghost" id="copySrv">复制</button>
      </div>
    </div>
  </div>

  <div class="srv">
    <input id="server" placeholder="自建解析服务地址，如 https://bili.example.com">
    <button class="ghost" id="saveSrv">保存</button>
  </div>

  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
